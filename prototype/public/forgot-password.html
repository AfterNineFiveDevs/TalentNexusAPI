<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forgot password · TalentNexus prototype</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/components.css">
</head>
<body data-shell="public" data-active="" data-root="../">
<main class="page page--narrow">

<div class="stack" style="max-width: 420px; width: 100%; margin: 0 auto">
<a class="btn btn--ghost" href="../public/sign-in.html" style="align-self: flex-start; padding: 0 4px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Back to sign in</a>
<header class="stack" style="--gap: 6px"><h1 class="t-display">Reset your password</h1><p class="t-body muted measure">Enter the email on your account. If it matches an account, we send a link that works for 30 minutes.</p></header>
<form class="stack" data-next="../public/reset-password.html"><div class="field"><label for="fp-email">Email</label><input class="input " id="fp-email" name="fp-email" type="email" value="thiri@example.com" ></div><button class="btn btn--primary btn--block" type="submit">Send reset link</button></form>
<p class="t-meta muted">We show the same message whether or not the email has an account, so nobody can use this page to check who is signed up.</p>
</div>
</main>
<script src="../assets/app.js"></script>
</body>
</html>
