<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work experience · TalentNexus prototype</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/components.css">
</head>
<body data-shell="candidate" data-active="profile" data-root="../">
<main class="page">

<a class="btn btn--ghost" href="../profile/profile.html" style="align-self: flex-start; padding: 0 4px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Career Profile</a>
<div class="stack" style="max-width: 760px">
<div class="row row--between row--top"><header class="stack" style="--gap: 6px"><h1 class="t-display">Work experience</h1></header><a class="btn btn--secondary btn--sm" href="../profile/profile.html" >Done</a></div>
<form class="card" style="border-color: var(--primary); gap: 16px" data-next="../profile/profile.html">
<div class="row" style="--gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h.01"/><path d="M15 6h.01"/><path d="M9 12h.01"/><path d="M15 12h.01"/><path d="M9 18h.01"/><path d="M15 18h.01"/></svg><span class="t-micro faint">Role 1 of 4</span></div>
<div class="row row--top"><div class="field"><label for="se-t">Job title</label><input class="input " id="se-t" name="se-t" type="text" value="Senior Accountant" ></div><div class="field"><label for="se-e">Employer</label><input class="input " id="se-e" name="se-e" type="text" value="Golden Star Trading" ></div></div>
<div class="row row--top"><div class="field"><label for="se-s">Start</label><input class="input " id="se-s" name="se-s" type="text" value="Mar 2021" ></div><div class="field"><label for="se-n">End</label><input class="input input--readonly" id="se-n" name="se-n" type="text" value="Present" readonly></div></div>
<label class="check"><input type="checkbox" checked>I still work here</label>
<div class="field"><label for="se-w">What you did</label><textarea class="textarea" id="se-w">Responsible for monthly accounts, supplier payments and stock reconciliation across three branches.</textarea></div>
<div class="row"><button class="btn btn--primary" type="submit">Save role</button><a class="btn btn--secondary" href="../profile/profile.html" >Cancel</a><button type="button" class="btn btn--danger" style="margin-left: auto" data-toast="Role deleted from your profile. CVs that used it now hide it.">Delete role</button></div>
</form>
<div class="card card--tight card--error"><span class="row" style="flex-wrap: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h.01"/><path d="M15 6h.01"/><path d="M9 12h.01"/><path d="M15 12h.01"/><path d="M9 18h.01"/><path d="M15 18h.01"/></svg><span class="stack grow" style="--gap: 2px"><span class="t-strong">Shop Supervisor</span><span class="t-meta muted">Yangon Mart · 2016 – 2018</span></span></span><span class="field-error"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--destructive)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>The end date is before the start date. Please check.</span></div>
<button type="button" class="btn btn--dashed btn--block" ><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>Add another role</button>
<p class="t-meta muted">Changing this role updates CVs that follow your profile. CVs where you changed the wording yourself are not touched; we ask you first (BR-PRF-007).</p>
</div>
</main>
<script src="../assets/app.js"></script>
</body>
</html>
