server {
    listen 443 ssl;
    server_name api-stag.talentnexus.app;

    ssl_certificate /run/secrets/tls-fullchain.pem;
    ssl_certificate_key /run/secrets/tls-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Resolve the Swarm service through Docker DNS even if the API starts later.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
